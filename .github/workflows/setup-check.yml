name: Setup check

# 템플릿으로 새 저장소를 만든 뒤 가장 먼저 한 번 실행한다. 자동으로 확인할 수 있는 것은
# 확인하고, 사람이 설정 화면에서 봐야 하는 것은 실행 요약(Summary)에 체크리스트로 남긴다.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/hy2219/medical-sdlc-db@sha256:62c601ebdbdba9e30d50f30f92eab9b70242f9a16e4808e7cdba8f496dbbb010
        env:
          POSTGRES_DB: medical
          POSTGRES_USER: medical
          POSTGRES_PASSWORD: medical
          LLM_DB_PASSWORD: ${{ secrets.LLM_DB_PASSWORD || 'llm-readonly-local' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medical -d medical"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PGPASSWORD: ${{ secrets.LLM_DB_PASSWORD || 'llm-readonly-local' }}
    steps:
      - name: Masked DB (image pull + read-only role)
        id: db
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          q() { psql -X -qAt -v ON_ERROR_STOP=1 -h 127.0.0.1 -U llm_reader -d medical -c "$1"; }
          rows=$(q "SELECT count(*) FROM llm.hospital")
          images=$(q "SELECT count(*) FROM llm.hospital WHERE image_data IS NOT NULL" 2>/dev/null || echo "?")
          echo "rows=$rows" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "llm.hospital rows=$rows images=$images"
          [ "$rows" -gt 0 ]

      - name: GitHub Pages
        id: pages
        run: |
          if build=$(gh api "repos/$REPO/pages" --jq .build_type 2>/dev/null); then
            echo "build_type=$build" >> "$GITHUB_OUTPUT"
          else
            echo "build_type=disabled" >> "$GITHUB_OUTPUT"
          fi

      - name: Agentic workflow files
        id: aw
        run: |
          echo "count=$(gh api "repos/$REPO/contents/.github/workflows" --jq '[.[].name | select(endswith(".lock.yml"))] | length')" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          ROWS: ${{ steps.db.outputs.rows }}
          IMAGES: ${{ steps.db.outputs.images }}
          PAGES: ${{ steps.pages.outputs.build_type }}
          AW: ${{ steps.aw.outputs.count }}
        run: |
          ok() { [ "$1" = yes ] && echo "✅" || echo "❌"; }
          db=$([ -n "$ROWS" ] && [ "$ROWS" -gt 0 ] 2>/dev/null && echo yes || echo no)
          pages=$([ "$PAGES" = workflow ] && echo yes || echo no)
          {
            echo "## Setup check"
            echo
            echo "| 항목 | 결과 | 조치 |"
            echo "|---|---|---|"
            echo "| 마스킹 DB 이미지 + llm_reader 접속 | $(ok $db) rows=${ROWS:-0}, images=${IMAGES:-?} | 실패 시 ghcr.io 접근(조직 방화벽/허용 액션)과 LLM_DB_PASSWORD 시크릿 값을 확인 |"
            echo "| GitHub Pages (Source = GitHub Actions) | $(ok $pages) ${PAGES} | Settings → Pages → Source 를 **GitHub Actions** 로 |"
            echo "| 에이전트 워크플로(.lock.yml) | ${AW:-0}개 | 4개여야 함 |"
            echo
            echo "### 화면에서 직접 확인할 것"
            echo "- [ ] Settings → Actions → General → Workflow permissions → **Allow GitHub Actions to create and approve pull requests** 체크"
            echo "- [ ] 이 저장소에서 GitHub Copilot 을 쓸 수 있는 계정/조직 정책 (에이전트 워크플로는 Copilot 요청을 사용)"
            echo "- [ ] (조직 저장소) Settings → Actions → General → Allow all actions, 또는 SETUP.md 의 액션 목록 허용"
            echo
            echo "다음 단계: Actions → **CXR Lens** 실행 → Pages 의 \`/cxr/\` 확인 → **Daily paper recommendations** 실행. 자세한 순서는 SETUP.md."
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$db" = yes ]
